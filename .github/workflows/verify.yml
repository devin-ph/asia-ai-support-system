name: Verify

on:
  # Every pushed branch runs CI, so solo work needs no pull request to get a result.
  push:
  workflow_dispatch:
  # A weekly run catches newly published vulnerabilities while the repo is idle.
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python-version }} / Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            node-version: "22"
          - python-version: "3.14"
            node-version: "26"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright browsers
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Check clean-clone readiness
        run: python scripts/dev.py doctor

      - name: Verify repository
        run: python scripts/dev.py verify --security

      - name: Run browser E2E
        run: npm run e2e --prefix frontend
